[package]
name = "nysh"
version = "0.0.0"
description = "SSH identity manager for GitHub, built for the terminal."
authors = ["Nyverune <nyverune@proton.me>"]
license = "MIT"
edition = "2024"

[dependencies]
color-eyre = "0.6.5"
crossterm = "0.29.0"
ratatui = "0.30.2"
strum = { version = "0.28.0", features = ["derive", "strum_macros"] }
strum_macros = "0.28.0"

# Read the optimization guideline for more details: https://ratatui.rs/recipes/apps/release-your-app/#optimizations
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
